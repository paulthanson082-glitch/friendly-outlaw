# Builds and tests the Swift library + CLI on both macOS and Linux.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main", "claude/**", "copilot/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  linux:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite dev files
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev pkg-config
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
