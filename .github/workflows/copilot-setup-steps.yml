name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify SQLite3 availability
        run: |
          # SQLite3 is pre-installed on macOS runners
          # Verify it's available
          which sqlite3
          sqlite3 --version
      - name: Build Swift project
        run: swift build -v
