name: iOS Build and Push

on:
  push:
    branches: [main, "claude/**", "copilot/**"]
    paths:
      - 'ios/ProNotes/**'
  pull_request:
    branches: [main]
    paths:
      - 'ios/ProNotes/**'

jobs:
  build:
    name: Build ProNotes iOS App
    runs-on: macos-latest

    env:
      SCHEME: ProNotes
      WORKSPACE: ios/ProNotes/ProNotes.xcworkspace
      PROJECT: ios/ProNotes/ProNotes.xcodeproj
      DESTINATION: platform=iPadOS Simulator,name=iPad Pro 13-inch (M4),OS=latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package dependencies
        run: |
          if [ -f "$WORKSPACE" ]; then
            xcodebuild -resolvePackageDependencies \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME"
          elif [ -f "$PROJECT" ]; then
            xcodebuild -resolvePackageDependencies \
              -project "$PROJECT" \
              -scheme "$SCHEME"
          fi

      - name: Build for simulator
        run: |
          if [ -f "$WORKSPACE" ]; then
            xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              | xcpretty
          elif [ -f "$PROJECT" ]; then
            xcodebuild build \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              | xcpretty
          else
            echo "No Xcode project or workspace found. Skipping build."
            echo "Follow the setup instructions in ios/ProNotes/Sources/ProNotesApp.swift to create the Xcode project."
            exit 0
          fi

      - name: Run tests
        if: github.event_name == 'push'
        run: |
          if [ -f "$WORKSPACE" ]; then
            xcodebuild test \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              | xcpretty
          elif [ -f "$PROJECT" ]; then
            xcodebuild test \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              | xcpretty
          fi

  archive-and-push:
    name: Archive and Push to TestFlight
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      SCHEME: ProNotes
      WORKSPACE: ios/ProNotes/ProNotes.xcworkspace
      PROJECT: ios/ProNotes/ProNotes.xcodeproj
      ARCHIVE_PATH: build/ProNotes.xcarchive
      EXPORT_PATH: build/ProNotes-ipa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive app
        run: |
          if [ -f "$WORKSPACE" ]; then
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              | xcpretty
          elif [ -f "$PROJECT" ]; then
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              | xcpretty
          else
            echo "No Xcode project or workspace found. Skipping archive."
            exit 0
          fi

      - name: Export IPA
        run: |
          if [ -d "$ARCHIVE_PATH" ]; then
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist ios/ProNotes/ExportOptions.plist \
              -exportPath "$EXPORT_PATH" \
              | xcpretty
          fi

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -d "$EXPORT_PATH" ]; then
            IPA_PATH=$(find "$EXPORT_PATH" -name "*.ipa" | head -1)
            if [ -n "$IPA_PATH" ]; then
              KEY_PATH=$RUNNER_TEMP/AuthKey.p8
              echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o $KEY_PATH

              xcrun altool --upload-app \
                --type ios \
                --file "$IPA_PATH" \
                --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
                --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
                --private-key "$KEY_PATH"
            fi
          fi

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
